<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Мои данные</title>
    <!-- Подключаем SDK Телеграма -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            padding: 20px;
            background: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 12px;
            padding: 16px;
            margin: 12px 0;
        }
        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #fff);
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
        }
        button:active {
            opacity: 0.7;
        }
        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .label {
            font-weight: 500;
            opacity: 0.7;
        }
        .value {
            font-weight: 400;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <h1>📊 Ваши данные</h1>
    <div class="card" id="dataDisplay">
        <!-- сюда будем выводить информацию перед отправкой -->
        <div class="info-item"><span class="label">Telegram ID</span><span class="value" id="tgId">-</span></div>
        <div class="info-item"><span class="label">Username</span><span class="value" id="tgUsername">-</span></div>
        <div class="info-item"><span class="label">Имя</span><span class="value" id="tgFirstName">-</span></div>
        <div class="info-item"><span class="label">Фамилия</span><span class="value" id="tgLastName">-</span></div>
        <div class="info-item"><span class="label">Язык</span><span class="value" id="tgLang">-</span></div>
        <div class="info-item"><span class="label">Premium</span><span class="value" id="tgPremium">-</span></div>
        <div class="info-item"><span class="label">Платформа</span><span class="value" id="tgPlatform">-</span></div>
        <div class="info-item"><span class="label">IP-адрес</span><span class="value" id="ipAddress">⏳ загрузка...</span></div>
        <div class="info-item"><span class="label">User-Agent</span><span class="value" id="userAgent">-</span></div>
    </div>

    <button id="sendBtn">📤 Отправить данные боту</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // растягиваем на весь экран

        // --- Получаем данные из Telegram ---
        const user = tg.initDataUnsafe?.user || {};
        const platform = tg.platform || 'unknown';

        // Заполняем поля на странице
        document.getElementById('tgId').textContent = user.id || 'не указан';
        document.getElementById('tgUsername').textContent = user.username || 'нет';
        document.getElementById('tgFirstName').textContent = user.first_name || 'не указано';
        document.getElementById('tgLastName').textContent = user.last_name || 'не указано';
        document.getElementById('tgLang').textContent = user.language_code || 'не указан';
        document.getElementById('tgPremium').textContent = user.is_premium ? '✅ Да' : '❌ Нет';
        document.getElementById('tgPlatform').textContent = platform;
        document.getElementById('userAgent').textContent = navigator.userAgent;

        // --- Получаем IP через внешний сервис ---
        async function fetchIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                document.getElementById('ipAddress').textContent = data.ip;
                return data.ip;
            } catch (error) {
                document.getElementById('ipAddress').textContent = '❌ не удалось получить';
                return null;
            }
        }

        // Ждём загрузки IP, но не блокируем интерфейс
        let ip = null;
        fetchIP().then(ipValue => { ip = ipValue; });

        // --- Кнопка отправки ---
        document.getElementById('sendBtn').addEventListener('click', function () {
            // Собираем все данные в объект
            const payload = {
                telegram_id: user.id || null,
                username: user.username || null,
                first_name: user.first_name || null,
                last_name: user.last_name || null,
                language_code: user.language_code || null,
                is_premium: user.is_premium || false,
                platform: platform,
                ip: document.getElementById('ipAddress').textContent,
                user_agent: navigator.userAgent,
                // можно добавить ещё что-то
                timestamp: new Date().toISOString()
            };

            // Отправляем JSON-строку боту
            tg.sendData(JSON.stringify(payload));

            // Можно показать уведомление об успехе
            tg.showAlert('✅ Данные отправлены боту!');

            // Закрыть окно (по желанию)
            // tg.close();
        });

        // Также можно отправить данные автоматически при открытии, но оставим по кнопке.
    </script>
</body>
</html>
